# Put this file at .github/workflows/update-feed.yml in your repo.
name: Update longevity feed

on:
  schedule:
    - cron: "0 14 * * *"   # daily at 14:00 UTC (6am Pacific)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_feed.py
        env:
          # Optional: only used if summary.mode is "claude" in config.yaml.
          # Add it under repo Settings -> Secrets and variables -> Actions.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update feed $(date -u +%F)"
          git push
